<style>
:root{--ink:#1d1b18;--digital:#ece8df;--film:#d7cbb9;--line:rgba(29,27,24,.18)}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;color:var(--ink);font-family:"DM Sans",Arial,sans-serif;background:var(--digital);transition:background-color 1.1s ease;overflow-x:hidden}body.film-mode{background:var(--film)}
.grain{position:fixed;inset:0;pointer-events:none;z-index:30;opacity:.04;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E")}
.topbar{position:fixed;inset:0 0 auto;z-index:20;display:flex;justify-content:space-between;align-items:flex-start;padding:20px 24px;font-size:10px;line-height:1.25;letter-spacing:.16em;mix-blend-mode:multiply}.wordmark,.contact{color:inherit;text-decoration:none}.subbrand{margin-top:7px;font-size:8px;letter-spacing:.18em;color:rgba(29,27,24,.62)}
.mode{position:fixed;left:50%;top:20px;transform:translateX(-50%);z-index:20;font-size:8px;letter-spacing:.22em;text-transform:uppercase;color:rgba(29,27,24,.7)}
.chapter{padding:6vh 4.5vw 10vh}.chapter + .chapter{padding-top:8vh}
.gallery{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1.05fr) minmax(0,.9fr);gap:10px;align-items:start}
.tile{margin:0}.tile img{display:block;width:100%;height:auto;filter:saturate(.88) contrast(.97)}
.feature{grid-column:auto}.stack{display:flex;flex-direction:column;gap:10px}.stack .tile{width:100%}
.tile{opacity:0;transform:translateY(22px);transition:opacity .85s ease,transform .95s cubic-bezier(.2,.7,.2,1)}.tile.visible{opacity:1;transform:translateY(0)}
.contact-section{min-height:88vh;padding:14vh 9vw 9vh;display:flex;flex-direction:column;justify-content:space-between;border-top:1px solid var(--line)}.contact-section h1{margin:0;font:400 clamp(72px,10vw,150px)/.84 "Cormorant Garamond",Georgia,serif;letter-spacing:-.04em}.contact-info{display:flex;flex-direction:column;gap:10px;font-size:11px;letter-spacing:.08em}.contact-info a{color:inherit;text-decoration:none;border-bottom:1px solid var(--line);width:max-content}
footer{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;padding:22px 24px 28px;border-top:1px solid var(--line);font-size:9px;letter-spacing:.16em}footer a{color:inherit;text-decoration:none}
@media(max-width:700px){.topbar{padding:16px}.mode{top:auto;bottom:16px;left:auto;right:16px;transform:none;font-size:8px}.chapter{padding:7vh 5vw 13vw}.gallery{display:flex;flex-direction:column;gap:10vw}.feature,.stack{width:100%}.stack{gap:10vw}.tile img{width:auto;max-width:100%;height:auto;max-height:none}.contact-section{min-height:85vh;padding:14vh 9vw 9vh}.contact-section h1{font-size:22vw}.subbrand{font-size:7px}}

</section>

<script>
const digitalFiles=['01.jpg','02.jpg','03.jpg','04.jpg'];
const filmFiles=['01_06_2026_Marcos_Carrascosa_0009.jpg','01_06_2026_Marcos_Carrascosa_0017.jpg','01_06_2026_Marcos_Carrascosa_0024.jpg','01_06_2026_Marcos_Carrascosa_0027.jpg','01_06_2026_Marcos_Carrascosa_0030_2.jpg','01_06_2026_Marcos_Carrascosa_0036.jpg','01_06_2026_Marcos_Carrascosa_0038.jpg'];
function load(src,alt,priority){return new Promise(resolve=>{const img=new Image();img.src=src;img.alt=alt;img.decoding='async';img.loading=priority?'eager':'lazy';if(priority)img.fetchPriority='high';img.onload=()=>resolve({img,portrait:img.naturalHeight>img.naturalWidth});img.onerror=()=>resolve(null)})}
async function build(id,files,folder,label){
 const el=document.getElementById(id);const data=(await Promise.all(files.map((f,i)=>load(`/${folder}/${f}`,label,i===0)))).filter(Boolean);const portraits=data.filter(x=>x.portrait),landscapes=data.filter(x=>!x.portrait);
 let first=true;
 while(portraits.length||landscapes.length){
   const mosaic=document.createElement('div');mosaic.className='gallery';
   const left=document.createElement('figure');left.className='tile feature';const center=document.createElement('figure');center.className='tile feature';const stack=document.createElement('div');stack.className='stack';
   const a=portraits.shift()||landscapes.shift();const b=portraits.shift()||landscapes.shift();
   if(a)left.appendChild(a.img);if(b)center.appendChild(b.img);
   for(let i=0;i<3&&landscapes.length;i++){const t=document.createElement('figure');t.className='tile';t.appendChild(landscapes.shift().img);stack.appendChild(t)}
   if(first){mosaic.append(left,center,stack);first=false}else{mosaic.append(left,center,stack)}
   if(left.children.length||center.children.length||stack.children.length)el.appendChild(mosaic);else break;
   if(!portraits.length&&!landscapes.length)break;
 }
 el.querySelectorAll('.tile').forEach(t=>{if(!t.querySelector('img'))t.remove()});
 const observer=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('visible')}),{threshold:.04});el.querySelectorAll('.tile').forEach(t=>observer.observe(t));
}
build('digital-gallery',digitalFiles,'digital','Fotografía de boda en digital');
build('film-gallery',filmFiles,'film','Fotografía de boda en analógico');
const body=document.body,mode=document.getElementById('mode'),film=document.getElementById('film');new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){body.classList.add('film-mode');mode.textContent='ANALÓGICA'}else if(e.boundingClientRect.top>0){body.classList.remove('film-mode');mode.textContent='DIGITAL'}}),{threshold:.18}).observe(film);
</script>
</body>
