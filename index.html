<style>
:root{--ink:#1d1b18;--digital:#ece8df;--film:#d7cbb9;--line:rgba(29,27,24,.18);--gap:1.8vw}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;color:var(--ink);font-family:"DM Sans",Arial,sans-serif;background:var(--digital);transition:background-color 1.1s ease;overflow-x:hidden}body.film-mode{background:var(--film)}
.grain{position:fixed;inset:0;pointer-events:none;z-index:30;opacity:.04;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E")}
.topbar{position:fixed;inset:0 0 auto;z-index:20;display:flex;justify-content:space-between;align-items:flex-start;padding:20px 24px;font-size:10px;line-height:1.25;letter-spacing:.16em;mix-blend-mode:multiply}.wordmark,.contact{color:inherit;text-decoration:none}.subbrand{margin-top:7px;font-size:8px;letter-spacing:.18em;color:rgba(29,27,24,.62)}
.mode{position:fixed;left:50%;top:20px;transform:translateX(-50%);z-index:20;font-size:8px;letter-spacing:.22em;text-transform:uppercase;color:rgba(29,27,24,.7)}
.chapter{padding:8vh 6vw 12vh}.chapter+.chapter{padding-top:9vh}
.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--gap);align-items:start;margin-bottom:var(--gap)}
.gallery:last-child{margin-bottom:0}
.tile{margin:0;min-width:0;opacity:0;transform:translateY(24px);transition:opacity .85s ease,transform .95s cubic-bezier(.2,.7,.2,1)}.tile.visible{opacity:1;transform:translateY(0)}
.tile img{display:block;width:100%;height:auto;filter:saturate(.88) contrast(.97)}
.tile.span-1{grid-column:span 1}.tile.span-2{grid-column:span 2}
.contact-section{min-height:88vh;padding:14vh 9vw 9vh;display:flex;flex-direction:column;justify-content:space-between;border-top:1px solid var(--line)}.contact-section h1{margin:0;font:400 clamp(72px,10vw,150px)/.84 "Cormorant Garamond",Georgia,serif;letter-spacing:-.04em}.contact-info{display:flex;flex-direction:column;gap:10px;font-size:11px;letter-spacing:.08em}.contact-info a{color:inherit;text-decoration:none;border-bottom:1px solid var(--line);width:max-content}
footer{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;padding:22px 24px 28px;border-top:1px solid var(--line);font-size:9px;letter-spacing:.16em}footer a{color:inherit;text-decoration:none}
@media(max-width:1000px){:root{--gap:2.4vw}.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}.tile.span-2{grid-column:1/-1}}
@media(max-width:700px){
:root{--gap:7vw}.topbar{padding:16px}.mode{top:auto;bottom:16px;left:auto;right:16px;transform:none;font-size:8px}
.chapter{padding:7vh 6vw 15vw}.chapter+.chapter{padding-top:10vh}
.gallery{display:flex;flex-direction:column;gap:12vw;margin-bottom:12vw}.tile,.tile.span-1,.tile.span-2{width:auto;max-width:100%;grid-column:auto;align-self:flex-start}.tile:nth-child(even){align-self:flex-end}.tile img{width:auto;max-width:88vw}
.contact-section{min-height:85vh;padding:14vh 9vw 9vh}.contact-section h1{font-size:22vw}.subbrand{font-size:7px}
}

<section class="chapter film" id="film" aria-label="Fotografía analógica"><div id="film-gallery"></div></section>

<script>
const digitalFiles=['01.jpg','02.jpg','03.jpg','04.jpg'];
const filmFiles=['01_06_2026_Marcos_Carrascosa_0009.jpg','01_06_2026_Marcos_Carrascosa_0017.jpg','01_06_2026_Marcos_Carrascosa_0024.jpg','01_06_2026_Marcos_Carrascosa_0027.jpg','01_06_2026_Marcos_Carrascosa_0030_2.jpg','01_06_2026_Marcos_Carrascosa_0036.jpg','01_06_2026_Marcos_Carrascosa_0038.jpg'];

function loadImage(src,alt,priority=false){return new Promise(resolve=>{const img=new Image();img.src=src;img.alt=alt;img.decoding='async';img.loading=priority?'eager':'lazy';if(priority)img.fetchPriority='high';const done=()=>resolve({img,portrait:img.naturalHeight>img.naturalWidth});img.addEventListener('load',done,{once:true});img.addEventListener('error',()=>resolve(null),{once:true})})}

function makeTile(item,span){const figure=document.createElement('figure');figure.className='tile';figure.classList.add(`span-${span}`);figure.appendChild(item.img);return figure}

async function buildGallery(targetId,files,folder,label){
 const target=document.getElementById(targetId);const items=(await Promise.all(files.map((file,i)=>loadImage(`/${folder}/${file}`,label,i===0&&folder==='digital')))).filter(Boolean);let remaining=[...items];let rowIndex=0;
 while(remaining.length){
  const portraits=remaining.filter(x=>x.portrait);const landscapes=remaining.filter(x=>!x.portrait);let picks=[];
  // Base rhythm: landscape + portrait. Occasionally reverse it and occasionally let a portrait take 2 columns.
  const heroPortrait=(rowIndex%4===3)&&portraits.length>0&&landscapes.length>0;
  if(heroPortrait){const p=portraits.shift();const l=landscapes.shift();picks=[{item:p,span:2},{item:l,span:1}];}
  else if(portraits.length&&landscapes.length){if(rowIndex%2===0){picks=[{item:portraits.shift(),span:1},{item:landscapes.shift(),span:2}]}else{picks=[{item:landscapes.shift(),span:2},{item:portraits.shift(),span:1}]}}
  else if(landscapes.length){picks=[{item:landscapes.shift(),span:2}];if(landscapes.length)picks.push({item:landscapes.shift(),span:1})}
  else {picks=[{item:portraits.shift(),span:(rowIndex%2?2:1)}];if(portraits.length)picks.push({item:portraits.shift(),span:1})}
  const used=new Set(picks.map(p=>p.item.img.src));remaining=remaining.filter(item=>!used.has(item.img.src));
  const row=document.createElement('div');row.className='gallery';
  picks.forEach(p=>row.appendChild(makeTile(p.item,p.span)));target.appendChild(row);rowIndex++;
 }
 const observer=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting)e.target.classList.add('visible')}),{threshold:.04});target.querySelectorAll('.tile').forEach(t=>observer.observe(t));
}

buildGallery('digital-gallery',digitalFiles,'digital','Fotografía de boda en digital');
buildGallery('film-gallery',filmFiles,'film','Fotografía de boda en analógico');

const body=document.body,mode=document.getElementById('mode'),film=document.getElementById('film');
new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){body.classList.add('film-mode');mode.textContent='ANALÓGICA'}else if(e.boundingClientRect.top>0){body.classList.remove('film-mode');mode.textContent='DIGITAL'}}),{threshold:.18}).observe(film);
</script>
