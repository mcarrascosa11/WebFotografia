<body>

<header class="header">
  <div class="header__left">
    <h1 class="header__name">MARCOS CARRASCOSA</h1>
    <p class="header__subtitle">FOTOGRAFÍA DE BODAS</p>
  </div>

    <span class="header__mode" id="modeIndicator">DIGITAL</span>
  </div>
  <div class="header__right">
    <a href="#contacto" class="header__contact">CONTACTO</a>
  </div>
</header>

<main>

  <!-- ================= DIGITAL ================= -->
  <section class="gallery-section gallery-section--digital" id="digital">
    <div class="gallery" data-gallery="digital">

      <!-- Patrón editorial: VERT | HORIZ──── | VERT | VERT | HORIZ──── ... -->
      <!-- El atributo data-span define el ancho. El CSS lo respeta sin JS. -->
      <!-- El JS solo refina si detecta orientación distinta. -->

      <figure class="gallery__item" data-span="1">
        <img src="digital/01.jpg" alt="" fetchpriority="high" decoding="async">
      </figure>
      <figure class="gallery__item" data-span="2">
        <img src="digital/02.jpg" alt="" fetchpriority="high" decoding="async">
      </figure>
      <figure class="gallery__item" data-span="1">
        <img src="digital/03.jpg" alt="" fetchpriority="high" decoding="async">
      </figure>
      <figure class="gallery__item" data-span="1">
        <img src="digital/04.jpg" alt="" loading="lazy" decoding="async">
      </figure>

    </div>
  </section>

  <!-- ================= ANALÓGICA ================= -->
  <section class="gallery-section gallery-section--analogue" id="analogica">
    <div class="gallery" data-gallery="film">

      <figure class="gallery__item" data-span="1">
        <img src="film/01_06_2026_Marcos_Carrascosa_0009.jpg" alt="" loading="lazy" decoding="async">
      </figure>
      <figure class="gallery__item" data-span="2">
        <img src="film/01_06_2026_Marcos_Carrascosa_0017.jpg" alt="" loading="lazy" decoding="async">
      </figure>
      <figure class="gallery__item" data-span="1">
        <img src="film/01_06_2026_Marcos_Carrascosa_0024.jpg" alt="" loading="lazy" decoding="async">
      </figure>
      <figure class="gallery__item" data-span="1">
        <img src="film/01_06_2026_Marcos_Carrascosa_0027.jpg" alt="" loading="lazy" decoding="async">
      </figure>
      <figure class="gallery__item" data-span="2">
        <img src="film/01_06_2026_Marcos_Carrascosa_0030_2.jpg" alt="" loading="lazy" decoding="async">
      </figure>
      <figure class="gallery__item" data-span="1">
        <img src="film/01_06_2026_Marcos_Carrascosa_0036.jpg" alt="" loading="lazy" decoding="async">
      </figure>
      <figure class="gallery__item" data-span="1">
        <img src="film/01_06_2026_Marcos_Carrascosa_0038.jpg" alt="" loading="lazy" decoding="async">
      </figure>

    </div>
  </section>

</main>
