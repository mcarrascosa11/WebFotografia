<style>

*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;color:var(--ink);font-family:"DM Sans",Arial,sans-serif;background:var(--digital);transition:background-color 1.1s ease;overflow-x:hidden}
body.film-mode{background:var(--film)}
.grain{position:fixed;inset:0;pointer-events:none;z-index:30;opacity:.04;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E")}
.topbar{position:fixed;inset:0 0 auto;z-index:20;display:flex;justify-content:space-between;align-items:flex-start;padding:20px 24px;font-size:10px;line-height:1.25;letter-spacing:.16em;mix-blend-mode:multiply}.wordmark,.contact{color:inherit;text-decoration:none}.subbrand{margin-top:7px;font-size:8px;letter-spacing:.18em;color:rgba(29,27,24,.62)}

.row{display:flex;align-items:flex-start;justify-content:center;gap:2.8vw;width:fit-content;max-width:100%}
.photo{margin:0;flex:0 0 auto;opacity:0;transform:translateY(24px);transition:opacity .85s ease,transform .95s cubic-bezier(.2,.7,.2,1)}
.photo.visible{opacity:1;transform:translateY(0)}
.photo img{display:block;width:auto;height:min(56vh,560px);max-width:46vw;object-fit:contain;object-position:center;filter:saturate(.88) contrast(.97)}
.row.reverse .photo:first-child{order:2}.row.reverse .photo:last-child{order:1}

.contact-info{display:flex;flex-direction:column;gap:10px;font-size:11px;letter-spacing:.08em}.contact-info a{color:inherit;text-decoration:none;border-bottom:1px solid var(--line);width:max-content}

<script>
const digitalFiles=['01.jpg','02.jpg','03.jpg','04.jpg'];
const filmFiles=['01_06_2026_Marcos_Carrascosa_0009.jpg','01_06_2026_Marcos_Carrascosa_0017.jpg','01_06_2026_Marcos_Carrascosa_0024.jpg','01_06_2026_Marcos_Carrascosa_0027.jpg','01_06_2026_Marcos_Carrascosa_0030_2.jpg','01_06_2026_Marcos_Carrascosa_0036.jpg','01_06_2026_Marcos_Carrascosa_0038.jpg'];

function imageItem(src,label,priority=false){
  return new Promise(resolve=>{
    const figure=document.createElement('figure');figure.className='photo reveal';
    const img=document.createElement('img');img.src=src;img.alt=label;img.loading=priority?'eager':'lazy';img.decoding='async';if(priority)img.fetchPriority='high';
    const done=()=>resolve({figure,portrait:img.naturalHeight>img.naturalWidth,area:img.naturalWidth*img.naturalHeight});
    img.addEventListener('load',done,{once:true});img.addEventListener('error',()=>resolve({figure,portrait:false,area:0}),{once:true});
    figure.appendChild(img);
  });
}

async function buildGallery(selector,files,folder,label){
  const el=document.querySelector(selector);
  const data=await Promise.all(files.map((file,i)=>imageItem(`/${folder}/${file}`,label,i===0&&folder==='digital')));
  const portraits=data.filter(x=>x.portrait);
  const landscapes=data.filter(x=>!x.portrait);
  let reverse=false;
  while(portraits.length||landscapes.length){
    const pair=[];
    if(portraits.length&&landscapes.length){
      pair.push(reverse?landscapes.shift():portraits.shift());
      pair.push(reverse?portraits.shift():landscapes.shift());
    }else if(landscapes.length){pair.push(landscapes.shift());if(landscapes.length)pair.push(landscapes.shift());}
    else {pair.push(portraits.shift());if(portraits.length)pair.push(portraits.shift());}
    const row=document.createElement('div');row.className='row'+(reverse?' reverse':'');
    pair.forEach(item=>row.appendChild(item.figure));el.appendChild(row);reverse=!reverse;
  }
  const observer=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting)e.target.classList.add('visible')}),{threshold:.05});
  el.querySelectorAll('.reveal').forEach(e=>observer.observe(e));
}

buildGallery('[data-gallery="digital"]',digitalFiles,'digital','Fotografía de boda en digital');
buildGallery('[data-gallery="film"]',filmFiles,'film','Fotografía de boda en analógico');

const body=document.body,mode=document.getElementById('mode'),film=document.getElementById('film');
new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){body.classList.add('film-mode');mode.textContent='ANALÓGICA'}else if(e.boundingClientRect.top>0){body.classList.remove('film-mode');mode.textContent='DIGITAL'}}),{threshold:.18}).observe(film);
</script>
