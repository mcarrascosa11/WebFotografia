name: Optimizar fotografías

on:
  push:
    branches: [main]
    paths:
      - 'digital/**/*.jpg'
      - 'digital/**/*.jpeg'
      - 'film/**/*.jpg'
      - 'film/**/*.jpeg'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Pillow
        run: python -m pip install --upgrade pillow
      - name: Optimizar JPG
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps

          roots = [Path('digital'), Path('film')]
          for root in roots:
              if not root.exists():
                  continue
              for p in root.rglob('*'):
                  if p.suffix.lower() not in {'.jpg', '.jpeg'}:
                      continue
                  try:
                      with Image.open(p) as im:
                          im = ImageOps.exif_transpose(im)
                          if im.mode not in ('RGB', 'L'):
                              im = im.convert('RGB')
                          max_width = 2400
                          if im.width > max_width:
                              h = round(im.height * max_width / im.width)
                              im = im.resize((max_width, h), Image.Resampling.LANCZOS)
                          im.save(p, 'JPEG', quality=84, optimize=True, progressive=True)
                          print(f'Optimizada: {p}')
                  except Exception as exc:
                      print(f'ERROR {p}: {exc}')
          PY
      - name: Commit de imágenes optimizadas
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add digital film
          if git diff --cached --quiet; then
            echo 'Sin cambios'
          else
            git commit -m 'Optimizar fotografías para web'
            git push
          fi
